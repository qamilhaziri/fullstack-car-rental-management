name: Continuous Deployment

on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy-render:
    name: Deploy verified main branch to Render
    # A pull request or a failed CI run must never deploy.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Deploy backend service
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_BACKEND_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK"
          curl --fail --show-error --silent --retry 3 --request POST "$DEPLOY_HOOK"

      - name: Deploy frontend static site
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_FRONTEND_DEPLOY_HOOK }}
        run: |
          test -n "$DEPLOY_HOOK"
          curl --fail --show-error --silent --retry 3 --request POST "$DEPLOY_HOOK"
