services:
  db:
    image: postgres:16-alpine
    container_name: car-rental-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: carRentalManagement
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carRentalManagement"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: car-rental-backend
    environment:
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: carRentalManagement
      DB_PORT: 5432
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 45min
      CLIENT_URL: http://localhost:5173
      LOG_LEVEL: info
    ports:
      - "5005:5005"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/car-rental-management
      args:
        VITE_API_URL: http://localhost:5005/api
    container_name: car-rental-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres-data:
